    Uzdevums: "{title}"

    ```{problem_text}```

    Atrisinājums:

    ```{solution_text}```

    Tipisko kļūdu saraksts šai nozarei (Markdown, ar CamelScript Label, īsu nosaukumu
    latviski un angliski, vienas rindkopas aprakstu un dažiem piemēriem):

    ```
    {domain_mistakes}
